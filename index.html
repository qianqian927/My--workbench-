<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的学习工作台</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b2b; --muted:#8a857a;
    --accent:#2f9e6e; --accent-soft:#e3f3ec; --line:#e8e4da;
    --amber:#e8a33d; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
  }
  .wrap{max-width:960px; margin:0 auto; padding:24px 16px 80px;}
  header{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  header h1{font-size:26px; letter-spacing:1px;}
  header .date{color:var(--muted); font-size:14px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat .num{font-size:28px; font-weight:700; color:var(--accent);}
  .stat .lbl{font-size:13px; color:var(--muted);}

  nav{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  nav button{
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:8px 18px; border-radius:999px; cursor:pointer; font-size:14px;
  }
  nav button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  section.tab{display:none;}
  section.tab.show{display:block;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .card h2{font-size:17px; margin-bottom:12px;}

  textarea,input[type=text],input[type=password],input[type=date]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; background:#fdfcfa; color:var(--ink);
  }
  textarea:focus,input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  textarea{resize:vertical; min-height:80px;}

  .btn{
    border:none; background:var(--accent); color:#fff; padding:9px 22px;
    border-radius:10px; cursor:pointer; font-size:14px;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.warn{background:#c0563a;}
  .btn:disabled{background:var(--line); color:var(--muted); cursor:default;}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .row > *{flex:1;}
  .row .fixed{flex:0 0 auto;}

  /* heatmap */
  .heatmap{display:flex; gap:3px; overflow-x:auto; padding-bottom:4px;}
  .hm-week{display:flex; flex-direction:column; gap:3px;}
  .hm-cell{width:13px; height:13px; border-radius:3px; background:#eceae3; flex:0 0 auto;}
  .hm-cell.checked{background:var(--accent);}
  .hm-cell.today{outline:2px solid var(--amber); outline-offset:1px;}
  .hm-legend{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); margin-top:8px; justify-content:flex-end;}

  .entry{border-bottom:1px dashed var(--line); padding:12px 0;}
  .entry:last-child{border-bottom:none;}
  .entry .meta{font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .entry .txt{margin-top:4px; font-size:14px; white-space:pre-wrap;}
  .tag{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:1px 8px; font-size:12px;}
  .del{border:none; background:none; color:#c0bcb2; cursor:pointer; font-size:13px; margin-left:auto;}
  .del:hover{color:#c0563a;}

  .empty{color:var(--muted); font-size:13px; text-align:center; padding:16px 0;}
  .checkin-ok{display:flex; align-items:center; gap:8px; color:var(--accent); font-weight:600;}
  .hint{font-size:12px; color:var(--muted); margin-top:8px;}
  .gains-date{font-size:12px; color:var(--muted);}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c0bcb2;margin-right:5px;vertical-align:middle;}
  .syncdot.on{background:var(--accent);}
  .syncdot.err{background:#c0563a;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📖 我的学习工作台</h1>
    <div class="date"><span class="syncdot" id="syncDot"></span><span id="todayLabel"></span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statCheckins">0</div><div class="lbl">累计打卡</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">连续打卡（天）</div></div>
    <div class="stat"><div class="num" id="statThoughts">0</div><div class="lbl">所思所想</div></div>
    <div class="stat"><div class="num" id="statGains">0</div><div class="lbl">学习收获</div></div>
  </div>

  <nav>
    <button class="active" data-tab="checkin">✅ 打卡</button>
    <button data-tab="thoughts">💭 所思所想</button>
    <button data-tab="gains">🌱 学习收获</button>
    <button data-tab="data">⚙️ 数据与同步</button>
  </nav>

  <!-- 打卡 -->
  <section class="tab show" id="tab-checkin">
    <div class="card">
      <h2>今日打卡</h2>
      <div id="checkinArea"></div>
      <textarea id="checkinNote" placeholder="今天学了什么？一句话记录（可选）" style="margin-top:10px;"></textarea>
      <div style="margin-top:10px;"><button class="btn" id="checkinBtn">打卡</button></div>
    </div>
    <div class="card">
      <h2>打卡热力图 <span style="font-size:12px;color:var(--muted);font-weight:400;">最近 20 周</span></h2>
      <div class="heatmap" id="heatmap"></div>
      <div class="hm-legend">少
        <span class="hm-cell" style="width:11px;height:11px;"></span>
        <span class="hm-cell checked" style="width:11px;height:11px;"></span> 多
      </div>
    </div>
  </section>

  <!-- 所思所想 -->
  <section class="tab" id="tab-thoughts">
    <div class="card">
      <h2>记录此刻的想法</h2>
      <textarea id="thoughtText" placeholder="想到什么就写下来，不用完整，不用正确……"></textarea>
      <div style="margin-top:10px;"><button class="btn" id="thoughtBtn">保存想法</button></div>
    </div>
    <div class="card">
      <h2>想法列表</h2>
      <div id="thoughtList"></div>
    </div>
  </section>

  <!-- 学习收获 -->
  <section class="tab" id="tab-gains">
    <div class="card">
      <h2>记录一条学习收获</h2>
      <div class="row">
        <input type="date" id="gainDate">
        <input type="text" id="gainTitle" placeholder="标题，如：理解了闭包">
      </div>
      <div class="row" style="margin-top:10px;">
        <input type="text" id="gainTags" placeholder="标签，逗号分隔（可选），如：JavaScript, 前端">
      </div>
      <textarea id="gainText" placeholder="具体学到了什么？可以写结论、例子、还没弄懂的地方……" style="margin-top:10px;"></textarea>
      <div style="margin-top:10px;"><button class="btn" id="gainBtn">保存收获</button></div>
    </div>
    <div class="card">
      <h2>收获归档</h2>
      <div id="gainList"></div>
    </div>
  </section>

  <!-- 数据与同步 -->
  <section class="tab" id="tab-data">
    <div class="card">
      <h2>☁️ 云端同步（多设备共用数据）</h2>
      <p class="hint" style="margin-bottom:12px;">填入你的 Gist ID 和 GitHub Token 后，手机电脑打开同一个链接即可看到同一份数据。密钥只保存在本机浏览器中，不会传给任何人。</p>
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="gistIdInput" placeholder="Gist ID（创建 gist 后网址里那串字符）" autocomplete="off">
      </div>
      <div class="row" style="margin-bottom:10px;">
        <input type="password" id="tokenInput" placeholder="GitHub Token" autocomplete="off">
      </div>
      <div class="row">
        <button class="btn fixed" id="saveSyncBtn">保存并连接</button>
        <button class="btn ghost fixed" id="syncNowBtn">立即同步</button>
        <button class="btn ghost fixed" id="clearSyncBtn">断开同步</button>
      </div>
      <p class="hint" id="syncStatus">未配置</p>
    </div>
    <div class="card">
      <h2>数据备份</h2>
      <p class="hint" style="margin-bottom:12px;">云同步之外，仍建议偶尔导出一份 JSON 到本地或网盘，双保险。</p>
      <div class="row">
        <button class="btn fixed" id="exportBtn">导出 JSON 备份</button>
        <label class="btn ghost fixed" style="display:inline-block;">导入备份<input type="file" id="importFile" accept=".json" style="display:none;"></label>
        <button class="btn warn fixed" id="wipeBtn">清空所有数据</button>
      </div>
      <p class="hint" id="dataInfo"></p>
    </div>
  </section>

</div>

<script>
const KEY = 'learning_workbench_v1';
const SYNCKEY = 'lw_sync_v1';
let db = load();
let sync = loadSync();
let lastSyncedContent = null;
let pushTimer = null;

function load(){
  try{ return normalize(JSON.parse(localStorage.getItem(KEY))); }
  catch(e){ return {checkins:{}, thoughts:[], gains:[]}; }
}
function normalize(d){
  d = d || {};
  return { checkins: d.checkins||{}, thoughts: d.thoughts||[], gains: d.gains||[], updatedAt: d.updatedAt||0 };
}
function save(){
  db.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(db));
  schedulePush();
}
function loadSync(){
  try{ return JSON.parse(localStorage.getItem(SYNCKEY)) || {}; }catch(e){ return {}; }
}

function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = fmtDate(new Date());

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('section.tab').forEach(x=>x.classList.remove('show'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('show');
  });
});

// ---------- sync ----------
function setSyncStatus(msg, ok){
  document.getElementById('syncStatus').textContent = msg;
  const dot = document.getElementById('syncDot');
  dot.className = 'syncdot' + (ok===true?' on':ok===false?' err':'');
}
async function api(url, opts){
  const r = await fetch(url, Object.assign({headers:{'Authorization':'Bearer '+sync.token,'Accept':'application/vnd.github+json'}}, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function pullRemote(){
  const g = await api('https://api.github.com/gists/'+sync.gistId);
  const f = g.files && g.files['data.json'];
  if(!f || !f.content) return null;
  try{ return normalize(JSON.parse(f.content)); }catch(e){ return null; }
}
async function push(){
  if(!sync.gistId || !sync.token) return;
  const content = JSON.stringify(db);
  if(content === lastSyncedContent) return;
  try{
    await api('https://api.github.com/gists/'+sync.gistId, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({files:{'data.json':{content: content}}})
    });
    lastSyncedContent = content;
    setSyncStatus('✅ 已同步 · '+new Date().toLocaleTimeString('zh-CN'), true);
  }catch(e){ setSyncStatus('⚠️ 同步失败：'+e.message+'（稍后自动重试）', false); }
}
function schedulePush(){
  if(!sync.gistId || !sync.token) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1500);
}
async function syncNow(){
  if(!sync.gistId || !sync.token){ setSyncStatus('请先在下方填写 Gist ID 和 Token', false); return; }
  setSyncStatus('🔄 正在连接云端…');
  try{
    const remote = await pullRemote();
    if(remote && (remote.updatedAt||0) > (db.updatedAt||0)){
      db = remote;
      localStorage.setItem(KEY, JSON.stringify(db));
      lastSyncedContent = JSON.stringify(db);
      renderAll();
      setSyncStatus('✅ 已同步（采用云端最新数据）· '+new Date().toLocaleTimeString('zh-CN'), true);
      return;
    }
    lastSyncedContent = lastSyncedContent; // keep
    await push();
    renderAll();
  }catch(e){ setSyncStatus('⚠️ 同步失败：'+e.message, false); }
}
document.getElementById('saveSyncBtn').addEventListener('click', ()=>{
  const id = document.getElementById('gistIdInput').value.trim();
  const tk = document.getElementById('tokenInput').value.trim();
  if(!id || !tk){ alert('两项都要填'); return; }
  sync = {gistId:id, token:tk};
  localStorage.setItem(SYNCKEY, JSON.stringify(sync));
  syncNow();
});
document.getElementById('syncNowBtn').addEventListener('click', syncNow);
document.getElementById('clearSyncBtn').addEventListener('click', ()=>{
  if(!confirm('断开同步？本机数据保留，云端数据保留，只是不再同步。')) return;
  sync = {}; localStorage.removeItem(SYNCKEY);
  document.getElementById('gistIdInput').value='';
  document.getElementById('tokenInput').value='';
  setSyncStatus('已断开同步');
});
function fillSyncInputs(){
  if(sync.gistId) document.getElementById('gistIdInput').value = sync.gistId;
  if(sync.token) document.getElementById('tokenInput').value = sync.token;
}

// ---------- checkin ----------
function renderCheckin(){
  const area = document.getElementById('checkinArea');
  const btn = document.getElementById('checkinBtn');
  const noteEl = document.getElementById('checkinNote');
  const c = db.checkins[today];
  if(c){
    area.innerHTML = '<div class="checkin-ok">🎉 今天已完成打卡'+(c.note?'：':'')+'</div>' + (c.note?'<div class="txt" style="font-size:14px;margin-top:6px;">'+escapeHtml(c.note)+'</div>':'');
    noteEl.style.display='none'; btn.disabled=true; btn.textContent='已打卡';
  }else{
    area.innerHTML=''; noteEl.style.display=''; btn.disabled=false; btn.textContent='打卡';
  }
}
document.getElementById('checkinBtn').addEventListener('click', ()=>{
  db.checkins[today] = { note: document.getElementById('checkinNote').value.trim(), ts: Date.now() };
  save(); renderAll();
});

// ---------- heatmap ----------
function renderHeatmap(){
  const el = document.getElementById('heatmap');
  el.innerHTML='';
  const weeks = 20;
  const now = new Date();
  const start = new Date(now);
  start.setDate(start.getDate() - start.getDay() - (weeks-1)*7);
  for(let w=0; w<weeks; w++){
    const col = document.createElement('div'); col.className='hm-week';
    for(let d=0; d<7; d++){
      const date = new Date(start); date.setDate(start.getDate()+w*7+d);
      const key = fmtDate(date);
      if(date > now) { col.appendChild(document.createElement('span')).className='hm-cell'; continue; }
      const cell = document.createElement('span');
      cell.className = 'hm-cell' + (db.checkins[key]?' checked':'') + (key===today?' today':'');
      cell.title = key + (db.checkins[key]?' ✅':'');
      col.appendChild(cell);
    }
    el.appendChild(col);
  }
}

// ---------- thoughts ----------
document.getElementById('thoughtBtn').addEventListener('click', ()=>{
  const t = document.getElementById('thoughtText').value.trim();
  if(!t) return;
  db.thoughts.unshift({id:Date.now(), ts:Date.now(), text:t});
  document.getElementById('thoughtText').value='';
  save(); renderAll();
});
function renderThoughts(){
  const el = document.getElementById('thoughtList');
  if(!db.thoughts.length){ el.innerHTML='<div class="empty">还没有想法，写下第一条吧 ✍️</div>'; return; }
  el.innerHTML = db.thoughts.map(t=>
    '<div class="entry"><div class="meta"><span>🕐 '+new Date(t.ts).toLocaleString('zh-CN')+'</span>'+
    '<button class="del" onclick="delThought('+t.id+')">删除</button></div>'+
    '<div class="txt">'+escapeHtml(t.text)+'</div></div>'
  ).join('');
}
function delThought(id){ if(!confirm('删除这条想法？'))return; db.thoughts=db.thoughts.filter(t=>t.id!==id); save(); renderAll(); }

// ---------- gains ----------
document.getElementById('gainDate').value = today;
document.getElementById('gainBtn').addEventListener('click', ()=>{
  const title = document.getElementById('gainTitle').value.trim();
  const text = document.getElementById('gainText').value.trim();
  if(!title && !text) return;
  db.gains.unshift({
    id:Date.now(),
    date: document.getElementById('gainDate').value || today,
    title, text,
    tags: document.getElementById('gainTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)
  });
  ['gainTitle','gainTags','gainText'].forEach(i=>document.getElementById(i).value='');
  save(); renderAll();
});
function renderGains(){
  const el = document.getElementById('gainList');
  if(!db.gains.length){ el.innerHTML='<div class="empty">还没有收获记录，学完一条记一条 🌱</div>'; return; }
  el.innerHTML = db.gains.map(g=>
    '<div class="entry"><div class="meta"><span class="gains-date">📅 '+g.date+'</span>'+
    g.tags.map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')+
    '<button class="del" onclick="delGain('+g.id+')">删除</button></div>'+
    (g.title?'<div class="txt" style="font-weight:600;">'+escapeHtml(g.title)+'</div>':'')+
    (g.text?'<div class="txt">'+escapeHtml(g.text)+'</div>':'')+
    '</div>'
  ).join('');
}
function delGain(id){ if(!confirm('删除这条收获？'))return; db.gains=db.gains.filter(g=>g.id!==id); save(); renderAll(); }

// ---------- stats ----------
function calcStreak(){
  let streak=0; const d=new Date();
  if(!db.checkins[fmtDate(d)]) d.setDate(d.getDate()-1);
  while(db.checkins[fmtDate(d)]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function renderStats(){
  document.getElementById('statCheckins').textContent = Object.keys(db.checkins).length;
  document.getElementById('statStreak').textContent = calcStreak();
  document.getElementById('statThoughts').textContent = db.thoughts.length;
  document.getElementById('statGains').textContent = db.gains.length;
  const bytes = (localStorage.getItem(KEY)||'').length;
  document.getElementById('dataInfo').textContent = '当前本地数据约 '+bytes+' 字节';
}

// ---------- data ----------
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '学习工作台备份-'+today+'.json';
  a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById('importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const data = normalize(JSON.parse(r.result));
      if(confirm('导入将覆盖当前全部数据，确定？')){ db=data; save(); renderAll(); alert('导入成功'); }
    }catch(err){ alert('文件格式不正确'); } };
  r.readAsText(f);
});
document.getElementById('wipeBtn').addEventListener('click', ()=>{
  if(confirm('确定清空所有数据？此操作不可恢复！')){
    if(confirm('再确认一次：真的要全部删除吗？')){ db={checkins:{},thoughts:[],gains:[],updatedAt:Date.now()}; save(); renderAll(); }
  }
});

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAll(){ renderCheckin(); renderHeatmap(); renderThoughts(); renderGains(); renderStats(); }
document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
fillSyncInputs();
renderAll();
if(sync.gistId && sync.token){ syncNow(); } else { setSyncStatus('未配置云端同步 —— 在下方填入 Gist ID 和 Token 即可多设备同步'); }
</script>
</body>
</html>
